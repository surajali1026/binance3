name: Android CI & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Compile Kotlin & Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --stacktrace
          else
            gradle :app:testDebugUnitTest --stacktrace
          fi

      - name: Run Android Lint Check
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:lintDebug --stacktrace
          else
            gradle :app:lintDebug --stacktrace
          fi

      - name: Build Debug & Release APK
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
            if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
              ./gradlew :app:assembleRelease --stacktrace
            else
              echo "Release signing secrets not set; building unsigned release APK fallback"
              ./gradlew :app:assembleRelease -Pandroid.injected.signing.store.file="" --stacktrace || true
            fi
          else
            gradle :app:assembleDebug --stacktrace
            if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
              gradle :app:assembleRelease --stacktrace
            fi
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binance-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-pro-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
