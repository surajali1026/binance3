<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body,#chart{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12}
#quick{position:absolute;right:5px;top:8px;z-index:5;width:30px;height:30px;border:1px solid #3b4653;border-radius:7px;background:#17212b;color:#f0b90b;font-size:21px;line-height:26px}
</style>
<script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
</head><body><div id="chart"></div><canvas id="drawing-layer" style="position:absolute;inset:0;pointer-events:none;z-index:3"></canvas><button id="quick" aria-label="Create price alert">+</button>
<script>
(function(){
 const el=document.getElementById('chart');
 const chart=LightweightCharts.createChart(el,{
  width:el.clientWidth,height:el.clientHeight,
  layout:{background:{type:'solid',color:'#090d12'},textColor:'#a7b0bb',fontFamily:'Arial',fontSize:11},
  grid:{vertLines:{color:'rgba(45,55,68,.35)'},horzLines:{color:'rgba(45,55,68,.35)'}},
  rightPriceScale:{borderColor:'#26313d',scaleMargins:{top:.08,bottom:.12},autoScale:true},
  timeScale:{borderColor:'#26313d',timeVisible:true,secondsVisible:false,rightOffset:8,barSpacing:8},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:'#75808d',style:LightweightCharts.LineStyle.Dashed},horzLine:{color:'#75808d',style:LightweightCharts.LineStyle.Dashed}},
  handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
  handleScale:{axisPressedMouseMove:{time:true,price:true},mouseWheel:true,pinch:true}
 });
 const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{
  upColor:'#0ecb81',downColor:'#f6465d',borderUpColor:'#0ecb81',borderDownColor:'#f6465d',
  wickUpColor:'#0ecb81',wickDownColor:'#f6465d',priceLineVisible:true,lastValueVisible:true
 });
 const volume=chart.addSeries(LightweightCharts.HistogramSeries,{
  priceFormat:{type:'volume'},priceScaleId:'volume',
  scaleMargins:{top:.82,bottom:0},lastValueVisible:false,priceLineVisible:false
 });
 chart.priceScale('volume').applyOptions({scaleMargins:{top:.82,bottom:0},visible:false});
 let lines=[]; let hasInitialData=false;
 const overlay=document.getElementById('drawing-layer'); const ctx=overlay.getContext('2d'); let activeDrawings=[];
 function paintDrawings(){ const w=el.clientWidth,h=el.clientHeight,dpr=window.devicePixelRatio||1; overlay.width=w*dpr;overlay.height=h*dpr;overlay.style.width=w+'px';overlay.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h); activeDrawings.forEach(d=>{const pts=d.points||[];if(pts.length<1)return;const x1=chart.timeScale().timeToCoordinate(pts[0].time),y1=candles.priceToCoordinate(pts[0].price);if(x1==null||y1==null)return;ctx.strokeStyle=d.color||'#f0b90b';ctx.fillStyle=(d.color||'#f0b90b')+'22';ctx.lineWidth=2;ctx.beginPath();if(d.type==='TRENDLINE'&&pts.length>1){const x2=chart.timeScale().timeToCoordinate(pts[1].time),y2=candles.priceToCoordinate(pts[1].price);if(x2==null||y2==null)return;ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}else if(d.type==='RECTANGLE'&&pts.length>1){const x2=chart.timeScale().timeToCoordinate(pts[1].time),y2=candles.priceToCoordinate(pts[1].price);if(x2==null||y2==null)return;ctx.rect(x1,y1,x2-x1,y2-y1);ctx.fill();ctx.stroke();}}); }
 function clearLines(){ lines.forEach(x=>{try{candles.removePriceLine(x)}catch(e){}});lines=[]; }
 window.setMarketData=function(payload){
  try{
   const d=JSON.parse(payload);
   candles.setData(d.candles||[]);
   volume.setData((d.candles||[]).map(x=>({time:x.time,value:x.volume||0,color:x.close>=x.open?'rgba(14,203,129,.35)':'rgba(246,70,93,.35)'})));
   clearLines();
   (d.lines||[]).forEach(l=>{
    if(Number.isFinite(l.price)&&l.price>0) lines.push(candles.createPriceLine({price:l.price,color:l.color||'#f0b90b',lineWidth:1,lineStyle:l.dashed?LightweightCharts.LineStyle.Dashed:LightweightCharts.LineStyle.Solid,axisLabelVisible:true,title:l.title||''}));
   });
   if(d.fit) chart.timeScale().fitContent();
  }catch(e){ if(window.AndroidChart) AndroidChart.onError(String(e)); }
 };
 chart.subscribeCrosshairMove(p=>{
  if(!p||!p.time||!p.point){return}
  const price=p.seriesData.get(candles);
  if(price&&window.AndroidChart) AndroidChart.onCrosshair(Number(p.time),Number(price.close||price.value||0));
 });
 chart.subscribeClick(p=>{
  if(!p||!p.time||!p.point)return;
  const price=candles.coordinateToPrice(p.point.y);
  if(price!=null&&window.AndroidChart) AndroidChart.onChartTap(Number(p.time),Number(price));
 });
 document.getElementById('quick').addEventListener('click',()=>{
  const range=candles.priceToCoordinate(candles.data().length?candles.data()[candles.data().length-1].close:0);
  const d=candles.data(); if(d.length&&window.AndroidChart) AndroidChart.onQuickAlert(Number(d[d.length-1].close));
 });
 chart.timeScale().subscribeVisibleLogicalRangeChange(paintDrawings);
 window.addEventListener('resize',()=>{chart.applyOptions({width:el.clientWidth,height:el.clientHeight});paintDrawings();});
 window.chartReady=true;
 if(window.AndroidChart) AndroidChart.onReady();
})();
</script></body></html>
